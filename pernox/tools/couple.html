<!doctype html><meta charset=utf-8><body style="margin:0;background:#3a2f50">
<canvas id=c width=300 height=150 style="image-rendering:pixelated;width:1500px;height:750px"></canvas>
<script src="../js/core/util.js"></script><script src="../js/engine/gfx.js"></script><script src="../js/engine/sprites.js"></script>
<script src="../js/data/furniture.js"></script><script src="../js/data/items.js"></script><script src="../js/data/npcs.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const cap=PX.NPC_BY_ID.cap.look, capS=Object.assign({},cap,{jacket:null,sleeve:'none'});
const me=PX.S.playerApp({skin:0,hair:'pony',hairColor:'흑발',eye:'갈색',outfit:'hoodie',job:'medic',gender:'여성'},'winter');
const meU=PX.S.playerApp({skin:0,hair:'pony',hairColor:'흑발',eye:'갈색',outfit:'uniform',job:'scout',gender:'여성'},'winter');
const he=PX.S.playerApp({skin:1,hair:'short',hairColor:'갈색',eye:'갈색',outfit:'shirt',job:'engineer',gender:'남성'},'winter');
let x=4;
const put=(a,p,f,v,face,y=0)=>{const s=PX.S.get(a,p,f,v,face);g.drawImage(s.c,x,4+y+(60-s.c.height));x+=s.c.width-4;};
put(cap,'idle',0,'F','smirk');put(me,'idle',0,'F','smile',0);x+=6;
put(cap,'idle',0,'F','normal');put(me,'idle',0,'F','blush');x+=6;
put(capS,'idle',0,'F','smile');put(meU,'idle',0,'F','normal');x+=6;
put(cap,'hold',0,'F','smile');put(me,'holdL',0,'F','smile');x+=6; put(he,'idle',0,'F','smirk');
x=4; g.translate(0,72);
put(cap,'idle',0,'B','normal');put(me,'idle',0,'B','normal');x+=6; put(cap,'hug',0,'F','smile');put(me,'hug',0,'B','blush');x+=6;
put(cap,'sit',0,'F','smirk');put(me,'sit',0,'F','smile');x+=6; put(cap,'walk',1,'F','normal');put(me,'walk',2,'F','normal');
window.done=1;
</script>
