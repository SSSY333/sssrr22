<!doctype html><meta charset=utf-8><body style="margin:0;background:#4a3f5a">
<canvas id=c width=600 height=260 style="image-rendering:pixelated;width:1800px;height:780px"></canvas>
<script src="../js/core/util.js"></script><script src="../js/engine/gfx.js"></script><script src="../js/engine/sprites.js"></script>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const cap={big:1,skin:'#e9b48c',hair:'slick',hairColor:'#1f1b26',eye:'#1d1820',top:'#3d4a33',bottom:'#4a5240',shoe:'#2a241e',sleeve:'none',scar:1,brows:'#1f1b26'};
const pl={skin:'#fde3cf',hair:'bob',hairColor:'#6b4430',eye:'#6b3d22',top:'#f4efe4',bottom:'#3a3f4a',shoe:'#5a3f2a',sleeve:'long',coat:'#ffffff'};
const pl2={skin:'#f6cba6',hair:'pony',hairColor:'#e78ab0',eye:'#3b6fd0',top:'#e58fa8',bottom:'#6a5aa8',shoe:'#5a3f2a',sleeve:'long',skirt:1};
let x=4,y=4;
for(const a of [cap,pl,pl2]){x=4;for(const v of ['F','B'])for(const p of ['idle','walk','sit','hug','hold','pat']){const s=PX.S.frame(a,p,1,v,'smirk');g.drawImage(s.c,x,y);x+=s.c.width-4;}y+=62}
x=4;for(const st of Object.keys(PX.S.HAIRS).concat(['slick'])){const a=Object.assign({},pl,{hair:st,coat:null,top:'#7fb86a'});const s=PX.S.frame(a,'idle',0,'F','smile');g.drawImage(s.c,x,y);x+=30;const t=PX.S.frame(a,'idle',0,'B','smile');g.drawImage(t.c,x,y);x+=30;}
window.done=1;
</script>
