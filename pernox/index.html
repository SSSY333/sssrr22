<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1430" />
  <title>사랑해, 이 행성이 멸망할 때까지.</title>
  <meta name="description" content="제5행성 페르녹스 · 지구군 606부대 — 쿼터뷰 SD 도트 생활 · 연애 시뮬레이션" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap&text=%EC%82%AC%EB%9E%91%ED%95%B4%2C%20%EC%9D%B4%ED%96%89%EC%84%B1%EB%A9%B8%EB%A7%9D%ED%95%A0%EB%95%8C%EA%B9%8C%EC%A7%80." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="labels"></div>
  <div id="bubbles"></div>
  <div id="fade"></div>

  <div id="loading"><b>페르녹스 접속 중…</b></div>

  <!-- 타이틀 -->
  <section id="title" class="screen hidden">
    <canvas id="titleArt"></canvas>
    <div class="tcard" id="tcard">
      <button class="tfold" id="tfold" aria-label="메뉴 접기">접기 ▾</button>
      <p class="eyebrow">제5행성 페르녹스 · 지구군 606부대</p>
      <h1>사랑해,<span class="l2">이 행성이 멸망할 때까지.</span></h1>
      <div id="titleBtns"></div>
    </div>
  </section>

  <!-- 캐릭터 생성 -->
  <section id="create" class="screen hidden">
    <div class="ccard">
      <div class="chead">
        <button id="createBack" class="ghost sm">← 뒤로</button>
        <b>캐릭터 만들기</b>
        <span></span>
      </div>
      <div class="cprev"><canvas id="createPreview"></canvas><small id="createName"></small></div>
      <div id="createBody"></div>
      <button id="createGo" class="big" disabled>페르녹스로 출발</button>
    </div>
  </section>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="top">
      <div class="clock"><b id="hTime">07:00</b><span id="hDate"></span></div>
      <div class="info"><span id="hWx"></span><span id="hMoney"></span><span class="ebar"><i id="hEnergy"></i></span></div>
    </div>
    <div class="loc" id="hLoc"></div>
    <button id="capChip" class="chip-cap"></button>
    <div class="side">
      <button id="termBtn" aria-label="개인 단말">📟<i id="termBadge" class="badge"></i></button>
      <button id="photoBtn" aria-label="사진 찍기">📷</button>
      <button id="decorBtn" aria-label="꾸미기 · 맵 편집">🛋️</button>
    </div>
    <button id="actBtn" class="hidden"></button>
    <div id="capBtns" class="hidden"><button id="talkBtn" aria-label="대위와 대화">💬</button><button id="skinBtn" aria-label="스킨십">🤝</button><button id="homeBtn" class="hidden" aria-label="같이 하기">🏠</button></div>
    <button id="moreBtn" class="hidden" aria-label="주변 대상 고르기">⋯</button>
    <div id="joy" class="hidden" aria-label="이동 조이스틱 (끝까지 밀면 달리기)"><div id="knob"></div></div>
    <div class="zoom"><button id="zoomIn" aria-label="확대">＋</button><button id="zoomOut" aria-label="축소">－</button></div>
  </div>

  <!-- 대화창 -->
  <div id="dlg" class="hidden">
    <canvas width="64" height="60"></canvas>
    <div class="dbody"><b class="dname"></b><p class="dtext"></p><span class="dnext hidden">▼</span></div>
  </div>
  <div id="choices" class="hidden"></div>
  <div id="chatbar" class="hidden">
    <p class="last"></p>
    <div class="chips2"></div>
    <div class="row2"><input type="text" maxlength="200" placeholder="하고 싶은 말" autocomplete="off" enterkeyhint="send" /><button class="send">보내기</button></div>
    <button class="end">대화 끝내기</button>
  </div>

  <div id="sheets"></div>
  <div id="mini" class="hidden"></div>
  <div id="toasts"></div>

  <!-- 코어 -->
  <script src="js/core/util.js"></script>
  <script src="js/core/calendar.js"></script>
  <!-- 엔진 -->

  <script src="js/data/furniture.js"></script>
  <script src="js/engine/objects.js"></script>
  <script src="js/engine/sprites.js"></script>
<script src="js/data/fashion.js"></script>

  <script src="js/data/maps.js"></script>
  <script src="js/data/maps_world.js"></script>

<script src="js/data/maps_shop.js"></script>

<script src="js/data/doorclear.js"></script>

  <script src="js/data/dialogue_captain.js"></script>
  <script src="js/data/dialogue_captain2.js"></script>
  <script src="js/data/dialogue_npc.js"></script>
  <script src="js/data/dialogue_more.js"></script>

  <script src="js/data/cap_favor.js"></script>
  <!-- 엔진 (월드) -->
  <script src="js/engine/path.js"></script>
