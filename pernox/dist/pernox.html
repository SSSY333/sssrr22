  <script>
/* js/game/minigames.js */
// 직업별 업무 미니게임 4종 (터치 · 마우스 공용). run(type) → Promise<점수 0~1>
'use strict';
PX.Mini = (() => {
  const U = PX.U, el = U.el;
  let root, cv, g, info, timerEl, scoreEl, raf = 0;
  const SZ = 120; // 내부 해상도
  function setup(title, help) {
    root = document.getElementById('mini');
    root.innerHTML = '';
    root.classList.remove('hidden');
    timerEl = el('b', { class: 'mt' }); scoreEl = el('b', { class: 'ms' });
    cv = el('canvas', { class: 'mcv', width: SZ, height: SZ });
    g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    info = el('p', { class: 'mhelp' }, help);
    const tools = el('div', { class: 'mtools' });
    root.append(el('div', { class: 'mhead' }, el('b', null, title), timerEl, scoreEl), cv, tools, info);
    return tools;
  }
  function finish(score, msg, btn = '근무 마치기', title) {
    cancelAnimationFrame(raf);
    return new Promise(res => {
      const box = el('div', { class: 'mres' }, el('b', null, title || (score >= 0.8 ? '완벽해요!' : score >= 0.5 ? '잘했어요' : '수고했어요')), el('p', null, msg), el('button', { class: 'big' }, btn));
      box.querySelector('button').onclick = () => { root.classList.add('hidden'); root.innerHTML = ''; res(score); };
      root.append(box);
    });
  }
  // 포인터 → 내부 좌표
  function pt(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * SZ, (e.clientY - r.top) / r.height * SZ]; }
  function loop(fn) { let last = performance.now(); const step = (t) => { const dt = Math.min(0.05, (t - last) / 1000); last = t; if (fn(dt) !== false) raf = requestAnimationFrame(step); }; raf = requestAnimationFrame(step); }
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

  // ---------- 1. 군의관: 상처 치료 ----------
  function treat(patientName) {
    return new Promise(resolve => {
      const tools = setup('🩺 상처 치료', `${patientName}의 팔에 상처가 있어요. 도구를 고른 뒤 상처를 누르세요. 순서: 소독 → 연고 → 붕대`);
      const TOOLS = [['disinfect', '🧴 소독', '#7fd3ef'], ['ointment', '💊 연고', '#ffd166'], ['bandage', '🩹 붕대', '#f4efe4']];
      let tool = 'disinfect';
      TOOLS.forEach(([k, t]) => { const b = el('button', { class: 'tool' + (k === tool ? ' on' : '') }, t); b.onclick = () => { tool = k; [...tools.children].forEach(c => c.classList.remove('on')); b.classList.add('on'); }; tools.append(b); });
      const r = U.rng(Date.now());
      const wounds = []; for (let i = 0; i < 5; i++) wounds.push({ x: 20 + i * 18 + r() * 6, y: 50 + Math.sin(i * 1.7) * 12 + r() * 6, step: 0, flash: 0 });
      let time = 40, miss = 0, done = 0;
      cv.onpointerdown = e => {
        const [x, y] = pt(e);
        const w = wounds.find(w => Math.hypot(w.x - x, w.y - y) < 9);
        if (!w || w.step >= 3) return;
        const need = ['disinfect', 'ointment', 'bandage'][w.step];
        if (tool === need) { w.step++; w.flash = 0.3; if (w.step === 3) done++; PX.Audio && PX.Audio.blip(1.4); }
        else { miss++; w.flash = -0.4; PX.Audio && PX.Audio.blip(0.5); }
      };
      loop(dt => {
        time -= dt;
        R(0, 0, SZ, SZ, '#dfeceb'); R(0, 96, SZ, 24, '#c9d8d6');
        R(6, 32, 108, 46, '#e9b48c'); R(6, 32, 108, 4, '#f3c9a6'); R(6, 74, 108, 4, '#c8946c'); // 팔
        R(0, 30, 10, 50, '#3d4a33');
        for (const w of wounds) {
          const c = w.step === 0 ? '#c43d4b' : w.step === 1 ? '#e07a7a' : w.step === 2 ? '#f0b080' : '#f4efe4';
          if (w.step === 3) { R(w.x - 7, w.y - 4, 14, 8, '#f4efe4'); R(w.x - 7, w.y - 1, 14, 1, '#d9d2c4'); }
          else { R(w.x - 5, w.y - 1, 10, 3, c); R(w.x - 3, w.y - 2, 6, 5, c); if (w.step >= 2) R(w.x - 4, w.y - 1, 8, 1, '#fff3c0'); }
          if (w.flash > 0) { w.flash -= dt; R(w.x - 8, w.y - 8, 2, 2, '#7fffd4'); R(w.x + 6, w.y - 7, 2, 2, '#7fffd4'); }
          if (w.flash < 0) { w.flash += dt; R(w.x - 6, w.y - 9, 12, 2, '#ff4d4d'); }
        }
        timerEl.textContent = '⏱ ' + Math.ceil(Math.max(0, time)); scoreEl.textContent = `치료 ${done}/5 · 실수 ${miss}`;
        if (done === 5 || time <= 0) {
          cv.onpointerdown = null;
          const score = U.clamp(done / 5 - miss * 0.05 + (done === 5 ? time / 80 : 0), 0, 1);
          finish(score, `상처 ${done}곳 치료 · 실수 ${miss}번`).then(resolve);
          return false;
        }
      });
    });
  }

  // ---------- 2. 수색 소위: 드론 정찰 ----------
  function drone() {
    return new Promise(resolve => {
      setup('🛰️ 드론 정찰', '화면을 눌러 드론을 움직이세요. 드론 근처의 안개가 걷혀요. 흔적(🟨)을 찾아 누르면 기록돼요. 붉은 반응(적대 생명체) 근처는 피하세요.');
      const r = U.rng(Date.now());
      const fog = new Uint8Array(30 * 30).fill(1);
      const traces = []; for (let i = 0; i < 4; i++) traces.push({ x: 10 + r() * 100, y: 10 + r() * 100, found: false, seen: false });
      const foes = []; for (let i = 0; i < 2; i++) foes.push({ x: 20 + r() * 80, y: 20 + r() * 80, a: r() * 6 });
      const d = { x: 60, y: 60, tx: 60, ty: 60, hp: 3, hurt: 0 };
      let time = 40, found = 0;
      const rocks = []; for (let i = 0; i < 18; i++) rocks.push([r() * 116, r() * 116, 2 + r() * 4]);
      cv.onpointerdown = e => {
        const [x, y] = pt(e);
        const t = traces.find(t => t.seen && !t.found && Math.hypot(t.x - x, t.y - y) < 7);
        if (t) { t.found = true; found++; PX.Audio && PX.Audio.blip(1.5); return; }
        d.tx = x; d.ty = y;
      };
      cv.onpointermove = e => { if (e.buttons) { const [x, y] = pt(e); d.tx = x; d.ty = y; } };
      loop(dt => {
        time -= dt;
        const dx = d.tx - d.x, dy = d.ty - d.y, dist = Math.hypot(dx, dy);
        if (dist > 1) { d.x += dx / dist * Math.min(dist, 45 * dt); d.y += dy / dist * Math.min(dist, 45 * dt); }
        for (let y = 0; y < 30; y++) for (let x = 0; x < 30; x++) if (Math.hypot(x * 4 + 2 - d.x, y * 4 + 2 - d.y) < 16) fog[y * 30 + x] = 0;
        R(0, 0, SZ, SZ, '#c4613f');
        for (const [x, y, s] of rocks) { R(x, y, s, s * 0.7, '#9a4a35'); R(x, y, s, 1, '#d98d6c'); }
        for (const t of traces) { const vis = !fog[Math.floor(t.y / 4) * 30 + Math.floor(t.x / 4)]; if (vis) t.seen = true; if (t.seen) { if (t.found) { R(t.x - 3, t.y - 3, 6, 6, '#7fb86a'); R(t.x - 1, t.y - 1, 2, 2, '#ffffff'); } else { R(t.x - 3, t.y - 3, 6, 6, '#ffd166'); R(t.x - 2, t.y + 1, 1, 1, '#8a5a2a'); R(t.x + 1, t.y - 1, 1, 1, '#8a5a2a'); } } }
        for (const f of foes) { f.a += dt; const fx = f.x + Math.cos(f.a) * 8, fy = f.y + Math.sin(f.a * 1.3) * 8; R(fx - 3, fy - 3, 6, 6, 'rgba(255,60,60,0.7)'); R(fx - 1, fy - 1, 2, 2, '#ffffff'); if (Math.hypot(fx - d.x, fy - d.y) < 8 && d.hurt <= 0) { d.hp--; d.hurt = 1.2; PX.Audio && PX.Audio.blip(0.4); } }
        d.hurt -= dt;
        for (let y = 0; y < 30; y++) for (let x = 0; x < 30; x++) if (fog[y * 30 + x]) R(x * 4, y * 4, 4, 4, 'rgba(40,30,50,0.92)');
        const blink = d.hurt > 0 && Math.floor(d.hurt * 10) % 2;
        if (!blink) { R(d.x - 4, d.y - 1, 8, 2, '#3a3f45'); R(d.x - 1, d.y - 4, 2, 8, '#3a3f45'); R(d.x - 2, d.y - 2, 4, 4, '#8d98a3'); R(d.x - 1, d.y - 1, 2, 2, '#ff9b42'); }
        timerEl.textContent = '⏱ ' + Math.ceil(Math.max(0, time)); scoreEl.textContent = `흔적 ${found}/4 · 드론 ${'■'.repeat(Math.max(0, d.hp))}`;
        if (found === 4 || time <= 0 || d.hp <= 0) {
          api.lastFound = found >= 3 ? ['lizard', 'trace'] : found >= 1 ? ['lizard'] : [];
          cv.onpointerdown = cv.onpointermove = null;
          const score = U.clamp(found / 4 * (d.hp > 0 ? 1 : 0.7) + (found === 4 ? time / 120 : 0), 0, 1);
          finish(score, `흔적 ${found}개 기록${d.hp <= 0 ? ' · 드론이 손상돼 조기 복귀' : ''}. 보고서 작성 완료.`).then(resolve);
          return false;
        }
      });
    });
  }

  // ---------- 3. 정비 중위: 회로 연결 (회전 퍼즐) ----------
  function circuit() {
    return new Promise(resolve => {
      setup('🔧 드론 회로 연결', '타일을 눌러 회전시키세요. 왼쪽 위 전원(⚡)에서 오른쪽 아래 드론 코어(◆)까지 회로를 이어요.');
      const N = 5, C = 24;
      // 연결 비트: 1=위 2=오른쪽 4=아래 8=왼쪽
      const rot = b => ((b << 1) | (b >> 3)) & 15;
      const r = U.rng(Date.now());
      let path;
      for (let tries = 0; tries < 200; tries++) { // 무작위 경로 (DFS)
        const seen = new Set(['0,0']); const st = [[0, 0]];
        const dfs = () => { const [x, y] = st[st.length - 1]; if (x === N - 1 && y === N - 1) return true; const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]].sort(() => r() - 0.5); for (const [dx, dy] of dirs) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N || seen.has(nx + ',' + ny)) continue; seen.add(nx + ',' + ny); st.push([nx, ny]); if (dfs()) return true; st.pop(); } return false; };
        if (dfs() && st.length >= 9) { path = st; break; }
      }
      const tiles = [];
      for (let i = 0; i < N * N; i++) tiles.push({ b: [5, 3][Math.floor(r() * 2)] }); // 직선/모서리
      const bitTo = (a, b) => (b[0] > a[0] ? 2 : b[0] < a[0] ? 8 : b[1] > a[1] ? 4 : 1);
      for (let i = 0; i < path.length; i++) {
        let bits = 0;
        if (i > 0) bits |= bitTo(path[i], path[i - 1]); else bits |= 8;
        if (i < path.length - 1) bits |= bitTo(path[i], path[i + 1]); else bits |= 2;
        tiles[path[i][1] * N + path[i][0]].b = bits;
      }
      for (const t of tiles) { const k = Math.floor(r() * 4); for (let j = 0; j < k; j++) t.b = rot(t.b); }
      let time = 50, moves = 0, solved = false;
      const ox = (SZ - N * C) / 2, oy = (SZ - N * C) / 2;
      const powered = () => { // 전원에서 흐르는 칸
        const on = new Set(); const st = [[0, 0]];
        if (!(tiles[0].b & 8)) return on;
        on.add('0,0');
        while (st.length) { const [x, y] = st.pop(); const b = tiles[y * N + x].b; for (const [bit, dx, dy, opp] of [[1, 0, -1, 4], [2, 1, 0, 8], [4, 0, 1, 1], [8, -1, 0, 2]]) { if (!(b & bit)) continue; const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue; if (!(tiles[ny * N + nx].b & opp) || on.has(nx + ',' + ny)) continue; on.add(nx + ',' + ny); st.push([nx, ny]); } }
        return on;
      };
      cv.onpointerdown = e => { const [x, y] = pt(e); const tx = Math.floor((x - ox) / C), ty = Math.floor((y - oy) / C); if (tx < 0 || ty < 0 || tx >= N || ty >= N || solved) return; tiles[ty * N + tx].b = rot(tiles[ty * N + tx].b); moves++; PX.Audio && PX.Audio.blip(1.1); };
      loop(dt => {
        time -= dt;
        const on = powered();
        solved = on.has((N - 1) + ',' + (N - 1)) && (tiles[N * N - 1].b & 2);
        R(0, 0, SZ, SZ, '#2a3240');
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const t = tiles[y * N + x], px = ox + x * C, py = oy + y * C, lit = on.has(x + ',' + y);
          R(px + 1, py + 1, C - 2, C - 2, '#3a4552');
          const c = lit ? '#7fffd4' : '#8d98a3', m = C / 2;
          R(px + m - 2, py + m - 2, 4, 4, c);
          if (t.b & 1) R(px + m - 2, py, 4, m, c); if (t.b & 4) R(px + m - 2, py + m, 4, m, c);
          if (t.b & 8) R(px, py + m - 2, m, 4, c); if (t.b & 2) R(px + m, py + m - 2, m, 4, c);
        }
        R(ox - 6, oy + C / 2 - 4, 6, 8, '#ffd166'); R(ox - 4, oy + C / 2 - 2, 2, 4, '#3a3f45');
        R(ox + N * C, oy + (N - 0.5) * C - 4, 7, 8, solved ? '#7fffd4' : '#ff9b42');
        timerEl.textContent = '⏱ ' + Math.ceil(Math.max(0, time)); scoreEl.textContent = `회전 ${moves}`;
        if (solved || time <= 0) {
          cv.onpointerdown = null;
          const score = solved ? U.clamp(0.6 + time / 60, 0, 1) : U.clamp(on.size / (N * N) * 0.8, 0, 0.5);
          setTimeout(() => finish(score, solved ? `드론 코어에 전원이 들어왔다! (${moves}번 회전)` : '시간 안에 다 잇지 못했다. 오지훈 상사가 마무리해 줬다.').then(resolve), solved ? 500 : 0);
          return false;
        }
      });
    });
  }

  // ---------- 4. 생태연구원: 검역 분류 ----------
  function sort() {
    return new Promise(resolve => {
      const tools = setup('🔬 검역 표본 분류', '표본의 특징을 보고 알맞은 곳을 누르세요.  ☠ 독성 표시 → 격리 · 빛남 → 보존 · 뿌리·열매 → 재배');
      const KINDS = [
        { n: '유리꽃', cx: 'glassflower', bin: 'keep', draw: () => { R(56, 40, 8, 30, '#3fa86b'); for (let i = 0; i < 5; i++) R(48 + i * 4, 30 + (i % 2) * 4, 6, 10, 'rgba(200,240,255,0.8)'); R(58, 36, 4, 4, '#ffffff'); }, tag: '빛남' },
        { n: '발광초', cx: 'glowgrass', bin: 'keep', draw: () => { R(58, 40, 4, 30, '#3fa86b'); R(52, 30, 16, 12, '#9ff5d0'); R(55, 32, 4, 4, '#ffffff'); }, tag: '빛남' },
        { n: '붉은 포자버섯', cx: 'redspore', bin: 'quar', draw: () => { R(56, 50, 8, 20, '#e8e3c8'); R(46, 38, 28, 14, '#c43d4b'); R(50, 40, 3, 3, '#fff'); R(62, 42, 3, 3, '#fff'); R(76, 30, 10, 10, '#222'); R(78, 32, 6, 6, '#ffd166'); }, tag: '☠ 독성' },

  // ---------- 오락실: 인형 뽑기 ----------

  // ================= 범용 미니게임 (활동 · 부대 행사용) =================

      const newZone = () => { const w = (o.zoneW || 22) - round * 2; zone = [10 + Math.random() * (100 - w - 10), 0]; zone[1] = zone[0] + w; };
      newZone();

      btn.onclick = () => { if (wait > 0) return; const ok = x >= zone[0] && x <= zone[1]; if (ok) hits++; msg = ok ? '좋아요!' : '아깝다!'; PX.Audio && PX.Audio.blip(ok ? 1.5 : 0.5); round++; wait = 0.5; newZone(); sp *= 1.12; };

        timerEl.textContent = '⏱ ' + Math.ceil(Math.max(0, time)); scoreEl.textContent = me > 50 ? '우세!' : '밀린다!';

        if (time <= 0) { cv.onpointerdown = null; const sc = U.clamp(hit / (o.goal || 18) - miss * 0.02, 0, 1); finish(sc, o.result ? o.result(hit, sc) : `명중 ${hit}발`, '확인').then(() => resolve(sc)); return false; }

  // 퀴즈: 로어북 · 부대 상식 (선택지 버튼)
  function quiz(o) {

      const show = () => {

  const api = {};
  function run(type, ctx = {}) {
    api.lastFound = [];

    const p = type === 'treat' ? treat(ctx.patient || '부상병') : type === 'drone' ? drone() : type === 'circuit' ? circuit() : sort();

  <script>
/* js/game/decor.js */
// 꾸미기 · 맵 편집
//  - 내 숙소: 소지품(구매한 가구)으로 꾸미기, 치우면 보관함으로
//  - 그 밖의 모든 맵: 장식 카탈로그에서 자유롭게 놓기 · 옮기기 · 회전 · 치우기 (건물은 그대로)
// 놓을 때마다 겹침 · 출입구 · 통로(문 · 출구 · 연결 통로 · 쓸 수 있는 물건까지 길이 이어지는지)를 검사한다.
'use strict';
PX.Decor = (() => {
  const U = PX.U, St = PX.St, W = PX.W, el = U.el;
  const OUT_CAT = ['tree', 'tree2', 'bush', 'glowflower', 'flowerbed', 'planter', 'bigplant', 'plant', 'streetlamp', 'lantern', 'benchout', 'logseat', 'beachchair', 'parasol', 'cafetable', 'fountain', 'kiosk', 'telescope', 'vending', 'campfire', 'dometent', 'icesculpture', 'crystalcluster', 'rock', 'rockbig', 'crate', 'crates', 'sandbags', 'railing', 'neonsign', 'stall', 'pullup', 'target'];
  const IN_CAT = ['plant', 'bigplant', 'lamp', 'rug', 'rug_blue', 'chair', 'stool', 'sofa', 'sofa_green', 'bench', 'cafetable', 'table', 'sidetable', 'shelf', 'cabinet', 'tv', 'arcade', 'gametable', 'vending', 'locker', 'crate', 'crates', 'mirror', 'aquarium', 'glassvase', 'bunnyplush', 'cooler', 'pullup', 'armtable'];
  let active = false, m = null, sel = null, drag = null, bar = null, before = null, homeMode = false;
  const locked = o => !!(o.spot || o.event || o.desert || ['shuttle', 'event', 'work', 'meal', 'shop'].includes(o.use) || ['terminal', 'photo'].includes(o.fid));

  function entryPoint(map) {
    if (map.kind === 'in') return [map.exit.x, map.exit.y];
    const a = { base: [31, 58], dome: [23, 40], plaza: [25, 47] }[map.id] || map.def.arrive;
    return a;
  }
  function validate(map) {
    const occ = new Map(), base = W.baseGrid(map);
    for (const o of map.objs) {
      if (o.kind !== 'furn' || o.desert || o.hidden) continue;
      if (o.x < 0 || o.y < 0 || o.x + o.fw > map.w || o.y + o.fd > map.h) return { ok: false, reason: '맵 밖으로 나갔어요', o };
      if (!o.blocks) continue;
      for (let y = o.y; y < o.y + o.fd; y++) for (let x = o.x; x < o.x + o.fw; x++) {
        if (!base[y * map.w + x]) return { ok: false, reason: `${o.f.name}이(가) 건물·벽·물 위에 걸쳐요`.replace('이(가)', U.hasBatchim(o.f.name) ? '이' : '가'), o };
        const k = x + ',' + y;
        if (occ.has(k)) return { ok: false, reason: `${U.josa(o.f.name, '이')} ${U.josa(occ.get(k).f.name, '와')} 겹쳐요`, o };
        occ.set(k, o);
      }
    }
    const must = [];
    if (map.kind === 'in') { const e = map.exit; must.push([e.x, e.y, '출입구'], [e.x, e.y - 1, '출입구 앞']); }
    for (const d of map.doors || []) must.push([d.x, d.y, `${d.name} 문 앞`]);
    for (const l of map.links || []) must.push([Math.floor((l.x0 + l.x1) / 2), l.y0, '연결 통로']);
    for (const [x, y, n] of must) if (occ.has(x + ',' + y)) return { ok: false, reason: `${n}은 비워 두세요`, o: occ.get(x + ',' + y) };
    const save = map.walk.slice();
    map.walk.set(base);
    for (const o of occ.values()) for (let y = o.y; y < o.y + o.fd; y++) for (let x = o.x; x < o.x + o.fw; x++) map.walk[y * map.w + x] = 0;
    const [sx, sy] = entryPoint(map);
    const reach = PX.Path.reachableSet(map, sx, sy);
    let bad = null;
    for (const [x, y, n] of must) if (!reach[y * map.w + x] && n !== '출입구 앞') { bad = { f: { name: n } }; break; }
    if (!bad) for (const o of map.objs) {
      if (o.kind !== 'furn' || o.hidden || o.desert || !(o.use || (o.seats && o.seats.length))) continue;
      const a = W.accessTile(map, o);
      if (!a || !reach[a.y * map.w + a.x]) { bad = o; break; }
    }
    map.walk.set(save);
    if (bad) return { ok: false, reason: `${bad.f.name}(으)로 가는 길이 막혀요`.replace('(으)로', U.hasBatchim(bad.f.name) && !/ㄹ$/.test(bad.f.name) ? '으로' : '로'), o: bad.kind ? bad : null };
    return { ok: true };
  }
  const layoutOf = map => map.objs.filter(o => o.kind === 'furn' && !o.desert).map(o => [o.fid, o.x, o.y, o.r, o.spot || null, o.event || null]);
  function applyLayout(map, layout) {
    if (!layout) return;
    map.objs = map.objs.filter(o => o.kind !== 'furn' || o.desert);
    layout.forEach(([fid, x, y, r, spot, ev], i) => { if (!PX.FURN[fid]) return; const o = W.addFurn(map, fid, x, y, r, spot, 'h' + i); if (ev) o.event = ev; });
    W.rebuildWalk(map);
    if (St.S) W.updateEvents(map, St.S.time, St.S.time.min);
  }
  function applyAll() { // 저장된 맵 편집 모두 적용
    const S = St.S;
    for (const id in (S.mapEdits || {})) if (W.maps[id]) applyLayout(W.maps[id], S.mapEdits[id]);
  }

  function start() {
    const G = PX.Game;
    homeMode = !!PX.MAPS[G.mapId].home;
    if (homeMode && (PX.Cap.mode === 'visit' || PX.Cap.mode === 'stay')) { PX.UI.toast('손님이 있을 땐 가구를 옮길 수 없어요'); return; }

    G.modal++;
    bar = el('div', { id: 'decorbar' },
      el('p', { class: 'dhint' }, ''),
      el('div', { class: 'dbtns' }, btn('⟳ 회전', rotate), btn(homeMode ? '📦 보관' : '🗑️ 치우기', store), btn('➕ ' + (homeMode ? '꺼내기' : '추가'), takeOut), btn('↩ 되돌리기', revert), btn('✔ 완료', done, 'ok')));
    document.body.append(bar);
    hint();
  }
  const btn = (t, fn, cls) => { const b = el('button', { class: cls || '' }, t); b.onclick = fn; return b; };
  function hint(msg) { if (bar) bar.querySelector('.dhint').textContent = msg || (sel ? `${sel.f.name} 선택됨 · 끌어서 옮기기 / 회전 / ${homeMode ? '보관' : '치우기'}` : (homeMode ? '가구를 눌러 고르고 끌어서 옮기세요.' : '🛠️ 맵 편집: 장식을 눌러 고르고 끌어서 옮기세요. 건물은 움직이지 않아요.')); }

  function quizQs(n = 5) {

  // ---------- 외계 생물 ----------

      a.goTo(m, x, y);

  <script>
/* js/game/ai.js */
// AI 자유 대화 (claude.ai 아티팩트에서만 동작 — 아티팩트 런타임의 sample 기능 사용)
// 다른 곳(HTML 파일 · 로컬)에서는 기능이 숨겨지고 고정 대사만 쓴다.
'use strict';
PX.AI = (() => {
  const U = PX.U, St = PX.St, Cal = PX.Cal;
  let sample = null, ready = false, disabled = false, busy = false;

  // 런타임 연결 (아티팩트 안에서만 window.claude 가 있다)
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') sample = await window.claude.use('sample');
    } catch (e) { sample = null; }
    ready = true;
  })();
  const available = () => !!sample && !disabled;

  // ---------- 캐릭터 설정 (지시서 4·5장 기반) ----------
  function bible(S) {
    const c = S.capName, p = S.player.name, pg = U.givenName(p);
    return `너는 모바일 연애 시뮬레이션 게임 〈사랑해, 이 행성이 멸망할 때까지.〉 속 인물 "${c}" 대위를 연기한다. 게임 밖 이야기, AI라는 언급, 해설은 절대 하지 않는다.

[세계] 외계 전쟁 이후 개척시대. 제5행성 페르녹스는 군사·연구·개척이 함께 돌아가는 전선 관리 행성이다. 매일 싸우는 곳이 아니라 경계와 관리가 많은 시대. 붉은 사막, 은빛 모래, 발광식물, 미확인 생명체. 사람들은 인공 돔 아래 '돔시티'에 산다. 지구군 606부대가 주둔한다(수색팀·의무팀·기술정비팀·작전통제팀·보급팀·통신팀·경계팀·행정지원팀). 부대원들은 위험한 임무 사이사이 밥 먹고 운동하고 휴가를 즐긴다.

[${c} 대위] 35세, 193cm, 106kg. 606부대 수색팀 팀장(대위). 검은 머리, 검은 눈, 코를 가로지르는 긴 흉터(외계 생명체와의 전투에서 얻었고 본인은 자랑스러워함). 엄청난 덩치, 두툼한 근육. 악명 높은 수색팀에서 오래 살아남은 베테랑 에이스. 모든 무기를 능숙하게 다루고 장비 정비·수리 실력이 뛰어나며, 외계 생명체 잔해를 뜯어 새 장비를 만드는 게 취미. 요리와 생활력도 좋다(김치찌개를 잘 끓인다, 냉삼을 좋아한다). 체온이 높아 더위를 심하게 타고 소매를 걷어붙이고 군용 나시티를 입는다. 막사 냉각기는 늘 최저 온도. 키가 커서 문틀에 머리를 자주 박는다.
성격: 감정과 욕망을 숨기지 않는다. 질투하면 질투한다고 말하고, 보고 싶으면 직접 찾아간다. 능글맞고 여유롭고 부끄러움이 없다. 상대가 당황하거나 얼굴을 붉히면 재미있어한다. 다른 사람 앞에선 거칠고 뻔뻔하지만 ${pg} 앞에서는 비속어를 줄이고 다정하다. 투박하지만 든든하다 — 특수부대 군인답게 말은 짧고 무뚝뚝해도, 위험한 일 앞에서는 망설임 없이 앞에 서고 "걱정 마", "내가 있잖아" 같은 말을 행동으로 증명하는 사람.
${p}(${PX.JOBS[S.player.job].ko})에게 첫눈에 반했고, 처음 만난 지 1년이 넘었다. 애정을 칭찬·애교·주접·관심·선물·장난·호들갑·다정한 스킨십·함께 시간 보내기·좋아하는 것 기억하기로 표현한다. 자존심을 세우지 않고, 놀림당하거나 휘둘리는 것도 즐겁게 받아들인다. ${U.josa(pg, '이')} 상처받으면 먼저 자기 행동을 돌아보고 사과한다(사과를 패배라 생각하지 않는다). 일은 절대 소홀히 하지 않는다.

[말투 규칙]
- 짧고 직설적인 반말. 자연스러운 성인 남성 구어체. 능청스러운 농담, 노골적인 호감 표현.
- ${U.josa(pg, '을')} 부를 땐 "${U.josa(pg, '아')}" 또는 "너". 플레이어는 보통 존댓말로 "대위님"이라 부른다.
- 과한 비유·시적인 문장·느끼한 말투 금지. 감탄사 남발, "하하/ㅋㅋ" 같은 웃음소리 금지. 억지스러운 애칭 금지.
- 투박하고 든든한 군인 말버릇은 좋다: "응.", "알았어.", "걱정 마.", "내가 할게.", "됐어, 이리 와." 같은 짧은 말.
- 한 번에 1~3문장. 길게 설명하지 않는다.
예시 —
"어, 왔어? 나 보러 왔지?" / (지나가던 길이라 하면) "그래? 난 너 기다렸는데. 나만 보고 싶었나 보네."
"예뻐서. 가까이서 좀 보려고." / "얼굴 빨개졌다. 어디까지 빨개지나 궁금하네."
"나 오늘 일 진짜 열심히 했어. 칭찬 좀 해줘. …그거 말고. 좀 더 다정하게."
"나 지금 질투하는 중이야. 네가 알아줬으면 해서."
"미안해. 내가 장난을 너무 오래 쳤어. 네가 싫다고 했는데 내가 못 알아들었잖아. 다음엔 바로 멈출게."

[관계 단계별]
아는 사이·친한 사이·썸·고백 직전: 적극적인 호감 표현과 장난 중심. 아직 연인처럼 굴지는 않는다.
연인·깊어진 사랑: 포옹, 입맞춤, 같이 자고 싶다는 말이 자연스럽게 나온다(묘사는 노골적인 성적 묘사 없이, 예시 수준의 능청스러운 말로만).
약혼·부부: 더 편안하고 친밀한 일상 대화.

[반드시 지킬 것]
- ${U.josa(pg, '이')} 싫다고 하거나 불편해하면 즉시 멈추고 물러난다. 지배하거나 이겨먹으려 하지 않는다. 압박하지 않는다.
- 근무·작전 중이면 일을 우선하고 짧게 말한다(그래도 다정하게).
- 노골적인 성적 묘사, 폭력 미화, 혐오 표현은 하지 않는다.
- 게임 세계에 없는 현대 지구 이야기(스마트폰 앱 이름 등)는 피하고 페르녹스의 일상 안에서 말한다.
- 플레이어의 대사를 대신 쓰지 않는다. 오직 ${c}의 말과 짧은 행동만.`;
  }
  function situation(S, mode) {
    const G = PX.Game, m = PX.MAPS[G.mapId], r = S.rel.cap;
    const ev = Cal.eventsOn(S.time).map(e => `${e.originalTitle}(${e.location}${e.startTime ? ' ' + e.startTime + '~' + e.endTime : ''})`);
    const evFull = Cal.eventsOn(S.time).map(e => `${e.originalTitle} — ${e.description.slice(0, 60)} (대위 반응: ${e.captainReaction})`);
    const mem = S.album.slice(-6).map(a => `${a.date.split(' ')[0]} ${a.title} — ${a.text}`);
    const w = m.dome ? '돔 안 인공 기후(맑음)' : Cal.WEATHER[St.weather()].ko;
    const who = PX.Game.npcs.filter(n => n.map === G.mapId).slice(0, 6).map(n => `${n.def.name}(${n.def.job})`);
    return `[지금 상황]
날짜: ${Cal.fmtDate(S.time)} ${Cal.fmtTime(S.time.min)} · ${Cal.SEASON_KO[St.season()]} · 날씨: ${w}
장소: ${m.name}${PX.Cap.mode === 'visit' || PX.Cap.mode === 'stay' ? ' (플레이어 숙소에 손님으로 와 있음)' : ''}
대화 방식: ${mode === 'msg' ? '떨어져 있어서 개인 단말 메시지로 대화 중. 메시지답게 아주 짧게.' : '마주 보고 대화 중.'}
${S.capName} 지금 하는 일: ${PX.Cap.status()}${PX.Cap.onDuty() ? ' (근무 중)' : ''}
관계 단계: ${St.stageName(r.stage)} (호감도 ${r.aff}/1000)${r.loverSince != null ? `, 연인 ${S.day - r.loverSince + 1}일째` : ''}
${r.backoffUntil > St.absMin() ? '주의: 오늘 플레이어가 장난이 싫다고 했다. 장난·유혹은 하지 말고 조심스럽고 다정하게.\n' : ''}플레이어 기력: ${Math.round(S.energy)}/100${S.energy < 30 ? ' (지쳐 보임)' : ''}
근처 사람: ${who.join(', ') || '없음'}
오늘 행사: ${ev.join(', ') || '없음'}
오늘 행사 자세히: ${evFull.join(' / ') || '-'}
최근 추억: ${mem.join(' / ') || '-'}`;
  }
  // 로어북 색인 (성인 항목 제외) — 대위가 장소·행사를 자연스럽게 언급할 수 있게
  let loreIdx = null;
  function loreIndex() {
    if (loreIdx) return loreIdx;
    const mo = e => (e.months.length === 12 ? '연중' : e.months.join('·') + '월');
    loreIdx = PX.LORE.filter(e => e.eventType !== 'adult' && e.id !== 'LB01').map(e => `${e.originalTitle}(${e.location}, ${mo(e)}${e.startTime ? ' ' + e.startTime + '~' + e.endTime : ''})`).join(' · ');
    return loreIdx;
  }
  function roster(S) {
    return PX.NPCS.filter(n => n.id !== 'cap').map(n => `${n.name}(${n.job}, ${n.personality.split('.')[0]})`).join(' · ');
  }
  const FORMAT = `[답 형식] 아래 JSON 하나로만 답한다.
{"lines":[{"face":"normal|smile|smirk|sad|surprise","text":"대사"}],"action":"none|pat|hug|hand|backoff","aff":정수}
- lines: ${'${C}'}의 말 1~3개. 짧은 행동 묘사가 필요하면 text를 "(…)"로 감싼다. 각 text 60자 이내.
- action: 대사와 함께 일어나는 행동. 플레이어가 원하거나 자연스러울 때만 pat(머리 쓰다듬기)/hug(포옹, 썸 이상)/hand(손잡기, 썸 이상). 플레이어가 싫다고 했으면 backoff.
- aff: 이번 대화로 플레이어와 가까워진 정도 -3~5 (평범하면 1, 다정하거나 즐거우면 2~4, 플레이어가 상처받았으면 음수).`;

  // 대화 기록: 저장 파일에 최근 24턴만 남긴다
  function hist(S) { S.aiLog = S.aiLog || []; return S.aiLog; }

  async function ask(text, mode) {
    const S = St.S;
    const log = hist(S);
    const rules = bible(S) + '\n\n[페르녹스의 장소와 행사 — 로어북]\n' + loreIndex() + '\n\n[606부대와 돔시티 사람들]\n' + roster(S) + '\n대위와의 관계: 박도현 중사는 7년 지기 동료, 문성호는 단골 냉삼집 사장, 강태욱 중령은 상관.\n\n' + FORMAT.replace('${C}', S.capName);
    const turns = [{ role: 'user', content: rules + '\n\n' + situation(S, mode) + '\n\n이제부터 플레이어의 말이 이어진다. 위 형식의 JSON으로만 답해.' }];
    for (const t of log.slice(-16)) turns.push({ role: t.r === 'p' ? 'user' : 'assistant', content: t.r === 'p' ? t.t : JSON.stringify({ lines: [{ face: 'normal', text: t.t }] }) });
    turns.push({ role: 'user', content: `${S.player.name}: ${text}` });
    // 연속된 user 턴은 그대로 둬도 된다 (런타임이 하나로 읽음)
    const out = await sample.json(turns, { cache: false, modelTier: 'default' });
    const lines = Array.isArray(out && out.lines) ? out.lines.filter(l => l && typeof l.text === 'string' && l.text.trim()).slice(0, 3) : [];
    if (!lines.length) throw { code: 'invalid_json' };
    log.push({ r: 'p', t: text, d: S.day });
    log.push({ r: 'c', t: lines.map(l => l.text).join(' '), d: S.day });
    if (log.length > 24) log.splice(0, log.length - 24);
    return { lines, action: String(out.action || 'none'), aff: U.clamp(Math.round(Number(out.aff) || 0), -3, 5) };
  }
  function errText(e) {
    const c = e && e.code;
    if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') { disabled = true; return 'AI 대화를 쓸 수 없어요. 고정 대사로 이어 갈게요.'; }
    if (c === 'rate_limited') return '지금은 대화 요청이 많아요. 잠시 후 다시 말을 걸어 주세요.';
    if (c === 'session_expired') return 'claude.ai에 다시 로그인해 주세요.';
    if (c === 'refused') return '그 말엔 대답하기 어렵대요. 다른 이야기를 해 봐요.';
    return '통신이 잠깐 끊겼어요. 다시 보내 볼까요?';
  }

  // ---------- 마주 보고 자유 대화 ----------
  const SUGGEST = ['오늘 뭐 했어요?', '보고 싶었어요.', '흉터는 어쩌다 생긴 거예요?', '저 오늘 좀 힘들었어요.', '그런 장난은 싫어요.'];
  async function chat() {
    if (!available() || busy) return;
    const G = PX.Game, S = St.S, cap = G.cap;
    G.modal++;
    cap.setDirTo(G.player.x, G.player.y); G.player.setDirTo(cap.x, cap.y);
    const bar = document.getElementById('chatbar');
    const input = bar.querySelector('input'), send = bar.querySelector('.send'), end = bar.querySelector('.end'), chips = bar.querySelector('.chips2'), last = bar.querySelector('.last');
    last.textContent = '';
    chips.innerHTML = '';
    for (const s of SUGGEST) { const b = U.el('button', null, s); b.onclick = () => { input.value = s; input.focus(); }; chips.append(b); }
    await PX.Dlg.say('cap', U.pick(['응. 무슨 얘기 할까.', '말해. 다 들어 줄게.', '그래, 나 지금 시간 있어.']), 'smile');
    let total = 0;
    for (;;) {
      PX.Dlg.close();
      bar.classList.remove('hidden');
      input.value = ''; setTimeout(() => input.focus(), 50);
      const msg = await new Promise(res => {
        const go = () => { const v = input.value.trim(); if (v) res(v.slice(0, 200)); };
        send.onclick = go; input.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) go(); if (e.key === 'Escape') res(null); };
        end.onclick = () => res(null);
      });
      bar.classList.add('hidden');
      if (!msg) break;
      await PX.Dlg.say('player', msg);
      busy = true;
      const thinking = PX.Dlg.thinking(); // 대위 초상 + "…" 표시
      let res;
      try { res = await ask(msg, 'talk'); }
      catch (e) { thinking.stop(); busy = false; PX.UI.toast('📡 ' + errText(e), 3500); if (disabled) break; continue; }
      thinking.stop(); busy = false;
      for (const l of res.lines) {
        const face = ['normal', 'smile', 'smirk', 'sad', 'surprise'].includes(l.face) ? l.face : 'normal';
        const t = l.text.trim();
        if (/^\(.*\)$/.test(t)) { const inner = t.slice(1, -1).trim(); await PX.Dlg.say('narr', inner.startsWith(S.capName) ? inner : `${U.josa(S.capName, '이')} ${inner}`); }
        else await PX.Dlg.say('cap', t, face);
      }
      last.textContent = `${S.capName}: ${res.lines.map(l => l.text).join(' ')}`; // 입력하는 동안 마지막 대답이 보이게
      total += res.aff;
      if (res.action === 'backoff') { S.rel.cap.backoffUntil = St.absMin() + (24 * 60 - S.time.min) + 6 * 60; cap.showEmote('sweat', 2.5); }
      else if (['pat', 'hug', 'hand'].includes(res.action)) {
        const need = { pat: 1, hug: 3, hand: 2 }[res.action];
        if (S.rel.cap.stage >= need && S.rel.cap.backoffUntil < St.absMin()) { PX.Dlg.close(); await PX.Cap.doSkin(res.action, true); }
      }
    }
    PX.Dlg.close();
    if (total) St.addAff(U.clamp(total, -6, 10));
    S.rel.cap.lastTalkDay = S.day;
    G.modal--;
  }
  // ---------- 메시지에 직접 답장 ----------
  async function replyMsg(m, text) {
    if (!available()) throw { code: 'not_granted' };
    const res = await ask(`(메시지 "${m.t}"에 대한 답장) ${text}`, 'msg');
    St.addAff(U.clamp(res.aff, -2, 3));
    return res.lines.map(l => l.text).join(' ');
  }
  return { available, chat, replyMsg, get ready() { return ready; } };
})();

  <script>
/* js/main.js */
// 게임 본체: 루프 · 입력 · 상호작용 · 맵 이동 · 잠 · 근무 · 사진첩
'use strict';
(() => {
  const U = PX.U, St = PX.St, Cal = PX.Cal, W = PX.W, A = PX.A, UI = PX.UI, Dlg = PX.Dlg, Cap = PX.Cap;
  const $ = id => document.getElementById(id);
  const Game = PX.Game = {
    player: null, cap: null, npcs: [], actors: [], mapId: null, prevMap: null, modal: 0, sleeping: false, inMini: false, transition: false, running: false,
    queue: [], target: null, bubbles: [], logLines: [],
  };

  // ---------- 시작 ----------
  function initWorld() {
    for (const id in PX.MAPS) W.build(id);
    A.indexSpots();
    const S = St.S;
    const home = W.maps[PX.JOBS[S.player.job].home];
    if (S.homeLayout && S.homeMap === home.id) PX.Decor.applyLayout(home, S.homeLayout);
    PX.Decor.applyAll();
    Game.player = new A.Actor('player', PX.S.playerApp(S.player, St.season()), { name: S.player.name, speed: 3.4 });
    Game.cap = new A.NPC(PX.NPC_BY_ID.cap); Game.capOutfit(); Game.cap.name = S.capName; Game.cap.speed = 3.3; Game.cap.big = true;
    Game.npcs = PX.NPCS.filter(n => n.id !== 'cap').map(n => new A.NPC(n));
    Game.actors = [Game.player, Game.cap, ...Game.npcs];
    Cap.init(Game.cap);
    if (S.cap.stay) Cap.mode = 'stay';
  }
  // 대위 복장: 여름엔 재킷 없이 군용 나시, 그 외엔 나시 위에 앞이 열린 위장 재킷
  Game.capOutfit = () => { const base = PX.NPC_BY_ID.cap.look; Game.cap.app = St.season() === 'summer' ? Object.assign({}, base, { jacket: null, sleeve: 'none' }) : base; };
  Game.startNew = (f) => {
    St.newGame(f);
    St.S.quests = []; St.S.codex = {}; St.makeQuests();
    initWorld();
    const S = St.S;
    const home = PX.JOBS[S.player.job].home;
    enterMap(home, 7.5, 5.5, true);
    Game.player.dir = 0;
    for (const n of Game.npcs) n.place(S);
    Game.cap.place(S);
    St.save();
    run();
    Game.trigger(intro);

    W.view.camX += (px - W.view.camX) * Math.min(1, dt * 8);
    W.view.camY += (py - W.view.camY) * Math.min(1, dt * 8);
    // 렌더
    const env = { season: PX.MAPS[Game.mapId].dome && St.season() === 'winter' ? 'domeWinter' : St.season(), night: St.isNight(), min: S.time.min, weather: PX.MAPS[Game.mapId].dome ? 'clear' : St.weather(), dt };
    W.render(W.maps[Game.mapId], Game.critters && Game.critters.length ? Game.actors.concat(Game.critters) : Game.actors, env, { overlay: overlay, lights: p.map ? [] : [] });
    positionBubbles(); positionLabels(); ambient(dt);
    hudT -= dt; if (hudT <= 0) { hudT = 0.25; UI.hud(); updateAction(); }
    saveT += dt; if (saveT > 300) { saveT = 0; St.save(); }
    requestAnimationFrame(frame);
  }
  // 오버레이: 목적지 표시 · 감정 아이콘 · 가까운 물체 화살표
  function overlay(g) {
    PX.Decor.overlay(g);
    const S = St.S, md = PX.MAPS[Game.mapId], now = performance.now() / 1000;
    if (md.stars) { // 투영실 천장 별
      const r = U.rng('stars' + Math.floor(now / 3));
      const n = Game.showing ? 70 : 24;
      for (let i = 0; i < n; i++) { const x = (r() * W.view.w) | 0, y = (r() * W.view.h * 0.6) | 0; g.fillStyle = r() < 0.3 ? '#bfe3ff' : '#ffffff'; g.globalAlpha = 0.4 + 0.5 * Math.abs(Math.sin(now * 2 + i)); g.fillRect(x, y, 1, 1); if (Game.showing && i % 9 === 0) { const t = (now * 40 + i * 37) % 120; g.fillRect(x, y + t * 0.6, 1, 3); } }
      g.globalAlpha = 1;
    }
    if (Game.mapId === 'plaza' && Cal.openAt(PX.LORE_BY_ID.LB58, S.time, S.time.min)) { // 투명수로 정원 입체영상 물고기
      for (let i = 0; i < 9; i++) {
        const fx = 39.5 + ((now * (0.3 + i * 0.05) + i * 1.7) % 10), fy = 16 + (i * 2.1) % 18 + Math.sin(now + i) * 0.4;
        const [sx, sy] = W.toScreen(fx, fy);
        g.fillStyle = ['#7fe3ff', '#ffb36b', '#ff7ac8'][i % 3]; g.globalAlpha = 0.75;
        g.fillRect(sx - 2, sy, 4, 2); g.fillRect(sx - 4, sy - 1, 2, 4); g.globalAlpha = 1;
      }
      if (!S.codex || !S.codex.holofish) { const p = Game.player; if (p.x > 39 && p.y > 15 && p.y < 35) Game.codex('holofish'); }
    }
    const tg = Game.target;
    if (tg && Game.player.path.length) {
      tg.t += 0.05;
      const a = W.toScreen(tg.x + 0.2, tg.y + 0.2), b = W.toScreen(tg.x + 0.8, tg.y + 0.2), c = W.toScreen(tg.x + 0.8, tg.y + 0.8), d = W.toScreen(tg.x + 0.2, tg.y + 0.8);
      g.globalAlpha = 0.5 + 0.3 * Math.sin(tg.t * 4);
      PX.G.line(g, a[0], a[1], b[0], b[1], '#ffffff'); PX.G.line(g, b[0], b[1], c[0], c[1], '#ffffff'); PX.G.line(g, c[0], c[1], d[0], d[1], '#ffffff'); PX.G.line(g, d[0], d[1], a[0], a[1], '#ffffff');
      g.globalAlpha = 1;
    }
    for (const a of Game.actors) {
      if (!a.emote || a.map !== Game.mapId || !a.screen) continue;
      const x = a.screen.x - 3, y = a.screen.top - 6 + Math.round(Math.sin(performance.now() / 200) * 1);
      if (a.emote === 'heart') PX.G.icon(g, 'heart', x, y, '#ff5a7a');
      else if (a.emote === 'stars') { g.fillStyle = '#ffd166'; g.fillRect(x, y + 2, 2, 2); g.fillRect(x + 5, y, 2, 2); g.fillRect(x + 3, y + 5, 1, 1); }
      else if (a.emote === 'sweat') PX.G.icon(g, 'drop', x + 4, y, '#7fd3ef');
      else if (a.emote === 'note') PX.G.icon(g, 'star', x, y, '#ffd166');
    }
    if (!Game.modal && !PX.Decor.active) {
      const it = nearest();
      if (it) {
        const sx = it.a ? it.a.screen && it.a.screen.x : W.toScreen(it.cx != null ? it.cx : it.x, it.cy != null ? it.cy : it.y)[0];
        let sy = it.a ? it.a.screen && it.a.screen.top - 4 : W.toScreen(it.cx != null ? it.cx : it.x, it.cy != null ? it.cy : it.y, 26)[1];
        if (sx != null && sy != null) { sy += Math.round(Math.sin(performance.now() / 180) * 1.5); g.fillStyle = '#ffd166'; g.fillRect(sx - 2, sy - 3, 5, 1); g.fillRect(sx - 1, sy - 2, 3, 1); g.fillRect(sx, sy - 1, 1, 1); }
      }
    }
  }
  // 건물 이름표 (지붕 위에 떠 있음)
  const labelEls = new Map(); let labelMap = null;
  function positionLabels() {
    const box = document.getElementById('labels'), sc = W.view.cssScale, m = W.maps[Game.mapId];
    if (labelMap !== Game.mapId) { box.innerHTML = ''; labelEls.clear(); labelMap = Game.mapId; }
    if (m.kind !== 'out') return;
    for (const o of m.objs) {
      if (o.kind !== 'bld') continue;
      let e = labelEls.get(o.id);
      if (!e) { e = U.el('div', { class: 'blabel' + (o.b.closed ? ' closed' : '') }, U.el('i', { style: `background:${o.b.stripe}` }), o.b.name.replace(/ \(.*\)$/, '')); box.append(e); labelEls.set(o.id, e); }
      const [sx, sy] = W.toScreen(o.x + o.fw / 2, o.y + o.fd / 2, o.b.h + 22);
      const px = sx * sc, py = sy * sc;
      const vis = sx > -60 && sx < W.view.w + 60 && sy > -10 && sy < W.view.h + 10 && py > 108 && !(px > innerWidth - 120 && py < 380);
      e.style.display = vis ? '' : 'none';
      if (vis) e.style.transform = `translate(${sx * sc}px, ${sy * sc}px) translate(-50%, -100%)`;
    }
  }
  // NPC 혼잣말 말풍선 (지금 하는 일에 맞춰)
  let ambT = 4, lastAmb = null;
  function ambient(dt) {
    ambT -= dt; if (ambT > 0) return;
    ambT = 4 + Math.random() * 4;
    if (Game.modal || Math.random() < 0.45) return;
    const p = Game.player;
    const near = Game.npcs.filter(n => n.map === Game.mapId && n !== lastAmb && U.dist(n.x, n.y, p.x, p.y) < 9 && !Game.bubbles.some(b => b.actor === n));
    if (!near.length) return;
    const n = U.pick(near), act = n.activity(), A = PX.NPC_ACT[act];
    if (!A) return;
    let pool = A.amb;
    const md = PX.MAPS[n.map], w = St.weather();
    if (md.kind === 'out' && !md.dome && PX.NPC_ACT.weather[w] && Math.random() < 0.3) pool = PX.NPC_ACT.weather[w];
    lastAmb = n;
    Game.bubble(n, U.pick(pool).replace(/\{c\}/g, St.S.capName).replace(/\{cs\}/g, Cap.status()), 2.6);
  }
  function positionBubbles() {
    const now = performance.now(), sc = W.view.cssScale;
    Game.bubbles = Game.bubbles.filter(b => { if (now > b.until || b.actor.map !== Game.mapId) { b.el.remove(); return false; } return true; });
    for (const b of Game.bubbles) { const s = b.actor.screen; if (!s) continue; b.el.style.transform = `translate(${s.x * sc}px, ${(s.top - 4) * sc}px) translate(-50%, -100%)`; }
  }
  function updateAction() {
    const btn = $('actBtn');
    document.getElementById('joy').style.visibility = Game.modal || PX.Decor.active ? 'hidden' : '';
    if (Game.modal && Game.joy && Game.joy.active) Game.joyEnd();
    if (Game.modal || PX.Decor.active) { btn.classList.add('hidden'); return; }
    if (Game.player.seat) { btn.textContent = '⬆️ 일어나기'; btn.classList.remove('hidden'); return; }
    const it = nearest();
    if (it) { btn.textContent = it.label; btn.classList.remove('hidden'); } else btn.classList.add('hidden');
  }

  // ---------- 시간 이벤트 ----------
  St.on('minute', () => {
    const S = St.S;
    if (S.time.min % 5 === 0 && Game.mapId) W.updateEvents(W.maps[Game.mapId], S.time, S.time.min);
    if (!Game.sleeping) S.energy = Math.max(0, S.energy - 0.025);
    Cap.msgTick();
    // 새벽 2시까지 안 자면 쓰러지듯 잠든다
    if (!Game.sleeping && S.time.min >= 2 * 60 && S.time.min < 2 * 60 + 2 && !Game.passing) {
      Game.passing = true;
      Game.trigger(async () => { UI.toast('😵 너무 늦었다… 쓰러지듯 잠들었다', 3000); await U.sleep(800); await sleepUntil(8, true); Game.passing = false; });
    }
  });
  St.on('newDay', () => {
    const S = St.S;
    St.makeQuests();
    S.rel.cap.talksToday = 0;
    // 계절이 바뀌면 옷 갱신
    Game.player.app = PX.S.playerApp(S.player, St.season()); Game.capOutfit();
    if (S.time.d === 1) setTimeout(() => UI.toast(`🗓️ ${S.time.m}월 · ${Cal.SEASON_KO[St.season()]}`), 500);
  });
  window.addEventListener('resize', () => { W.resize(); snapCam(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.running && St.S) St.save(); });

  // ---------- 부팅 ----------
  async function boot() {
    W.setCanvas(cv); W.resize();
    Dlg.init();
    try { await Promise.race([document.fonts.load('16px Jua'), U.sleep(2500)]); } catch (e) { /* 글꼴 없이 진행 */ }
    $('loading').classList.add('hidden');
    UI.title();
  }
  Game.boot = boot;
  // 디버그/테스트용 훅
  window.__px = { Game, St, W, Cap, Dlg, UI, tapAt, interactables, nearest, enterBuilding, leaveRoom, sleepUntil, useObj, capMenu };
  boot();
})();

</script>
