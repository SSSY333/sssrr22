<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}[hidden]{display:none!important}</style></head><body>

<style>
/* 보장원 도트: 쿼터뷰 픽셀 화면 위에 종이 카드 HUD (해월도·개금역과 같은 결) */
:root {

  --accent: #e0703c; --accent2: #f2b33d; --accent3: #ffe0c8; --navy: #2b2340; --mint: #7cc6b4; --pinkv: #e85d8a;
  --font: 'Jua', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--navy); overflow: hidden; }
body { font-family: var(--font); color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; word-break: keep-all; overflow-wrap: break-word; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent2); outline-offset: 2px; }
.hidden { display: none !important; }
[hidden] { display: none !important; }
#game { position: relative; width: 100%; height: 100%; overflow: hidden; background: #6fa8d8; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; display: block; }

/* HUD */
#hud { position: absolute; left: 0; right: 0; top: 0; padding: 8px max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); pointer-events: none; z-index: 10; display: flex; gap: 6px; align-items: flex-start; }
.box { background: var(--paper); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); }
#brand { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 15px; }
#brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); border: 2px solid var(--line); }
#brand small { color: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
#clockBox { display: flex; align-items: center; gap: 5px; padding: 4px 9px; font-size: 14px; font-variant-numeric: tabular-nums; }
#clockBox small { color: var(--ink2); font-size: 11px; }
#topbtns { margin-left: auto; display: flex; gap: 5px; pointer-events: auto; }
#topbtns button { width: 38px; height: 38px; padding: 0; font-size: 17px; display: grid; place-items: center; }
#topbtns button:active, .big:active, .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
#music.off { opacity: .45; }

#placeTag { position: absolute; left: 50%; top: 58px; transform: translate(-50%, -8px); opacity: 0; color: #fff; font-size: 16px; background: rgba(43,34,48,.75); padding: 5px 14px; border-radius: 99px; pointer-events: none; white-space: nowrap; z-index: 9; }
#placeTag.show { animation: tag 2.4s ease forwards; }
@keyframes tag { 10% { opacity: 1; transform: translate(-50%, 0); } 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }
#hint { position: absolute; left: 50%; transform: translateX(-50%); top: 92px; margin: 0; padding: 5px 12px; border-radius: 99px; background: rgba(43,34,48,.6); color: var(--paper); font-size: 12.5px; white-space: nowrap; pointer-events: none; z-index: 9; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

/* 조이스틱 */
#joy { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 112px; height: 112px; border-radius: 50%; background: rgba(43,34,48,.35); border: 3px solid rgba(255,247,236,.65); touch-action: none; z-index: 12; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: var(--paper); border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); pointer-events: none; }
@media (pointer: fine) { #joy { opacity: .5; } }

/* 행동 버튼 */
#actBtn { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 96px; height: 96px; border-radius: 50%; background: #fff0a8; border: 4px solid var(--line); box-shadow: 0 5px 0 var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; z-index: 12; animation: pop .2s ease, pulse 1.3s ease-in-out infinite; }
#actBtn span { font-size: 28px; line-height: 1; } #actBtn b { font-weight: 400; font-size: 12.5px; margin-top: 3px; line-height: 1.1; text-align: center; max-width: 86px; }
#actBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
@keyframes pop { from { transform: scale(.6); } }
@keyframes pulse { 50% { transform: scale(1.05); } }
#side { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); z-index: 12; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.chip { background: var(--paper); border: 3px solid var(--line); border-radius: 999px; box-shadow: 0 3px 0 var(--line); padding: 7px 13px; font-size: 14px; white-space: nowrap; }
.chip.hot { background: var(--accent); color: #fff; }
.chip.pink { background: var(--pinkv); color: #fff; }
#talk[aria-expanded="true"] { background: #ffe7a8; }
#phrases { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 140px); z-index: 13; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-height: 34vh; overflow-y: auto; touch-action: pan-y; padding: 2px; }
#phrases .chip { font-size: 13.5px; padding: 6px 11px; animation: tin .18s ease both; }
@keyframes tin { from { opacity: 0; transform: translateY(6px) scale(.96); } }
@media (min-width: 760px) { #phrases { left: auto; width: min(640px, 70%); justify-content: flex-end; right: 130px; bottom: 30px; } }

#toasts { position: absolute; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 250px); display: flex; flex-direction: column-reverse; align-items: center; gap: 6px; pointer-events: none; z-index: 14; }
.toast { background: var(--paper); border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); padding: 6px 12px; font-size: 14px; text-align: center; animation: tin .25s ease; transition: opacity .4s, transform .4s; }
.toast.out { opacity: 0; transform: translateY(-8px); }

/* 시트 · 팝업 */
.screen-pop { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(30,22,40,.5); }
.pop { background: var(--paper); border: 4px solid var(--line); border-radius: 20px; box-shadow: 0 5px 0 var(--line); padding: 16px; width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto; animation: pop .22s ease; touch-action: pan-y; display: flex; flex-direction: column; gap: 10px; }
.pop h2 { margin: 0; font-weight: 400; font-size: 21px; text-align: center; }
.pop p { margin: 0; color: var(--ink2); font-size: 14px; line-height: 1.5; text-align: center; }
.big { display: block; width: 100%; font-size: 18px; background: var(--accent); color: #fff; border: 4px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--line); padding: 11px; }
.big.alt { background: #fff; color: var(--ink); }
.big.pink { background: var(--pinkv); }
.big:disabled { filter: grayscale(.6); opacity: .7; }
.row { display: flex; gap: 8px; } .row .big { flex: 1; } .row .big.alt { flex: .6; }
.vent-pop { background: #fff4f0; border-color: #6b2a44; box-shadow: 0 5px 0 #6b2a44; }
.vent-pop h2 { color: #b23a62; }
#ventText { width: 100%; min-height: 120px; resize: none; border: 3px solid #e7a9bc; border-radius: 14px; padding: 10px 12px; font: 16px var(--font); color: var(--ink); background: #fff; -webkit-user-select: text; user-select: text; }
#ventText:focus { outline: none; border-color: var(--pinkv); }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
.designs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.design { background: #fff; border: 3px solid var(--line); border-radius: 12px; box-shadow: 0 3px 0 var(--line); padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.design canvas { width: 100%; max-width: 60px; image-rendering: pixelated; display: block; }
.design span { font-size: 12px; color: var(--ink2); }
.design.on { background: var(--accent3); border-color: var(--accent); box-shadow: 0 3px 0 var(--accent); }
.tplist { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.tplist .chip { border-radius: 14px; font-size: 15px; padding: 10px 6px; }
#shotImg { width: 100%; border: 3px solid var(--line); border-radius: 10px; image-rendering: pixelated; background: #222; max-height: 55vh; object-fit: contain; }
.people { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
.person { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 5px 10px; font-size: 14px; }
.person canvas { width: 30px; image-rendering: pixelated; }
.person small { margin-left: auto; color: var(--ink2); font-size: 12px; }
.lbl { display: block; font-size: 14px; }
.lbl input { display: block; width: 100%; margin-top: 5px; font-family: inherit; font-size: 17px; padding: 9px 12px; border: 3px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); outline: none; -webkit-user-select: text; user-select: text; }

/* 타이틀 */
#title { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 26px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(43,35,64,.15), rgba(43,35,64,.55)); overflow-y: auto; touch-action: pan-y; }
.logo { text-align: center; color: #fff; margin-top: 2vh; }
.logo canvas { width: min(62vw, 250px); image-rendering: pixelated; display: block; margin: 0 auto; }
.logo small { display: inline-block; font-size: 14px; background: var(--navy); padding: 3px 12px; border-radius: 99px; border: 3px solid var(--line); margin-top: 8px; }
.logo h1 { margin: 6px 0 0; font-weight: 400; font-size: clamp(44px, 13vw, 64px); line-height: 1; letter-spacing: 2px; text-shadow: 0 4px 0 var(--line), 3px 0 0 var(--line), -3px 0 0 var(--line), 0 -3px 0 var(--line), 3px 3px 0 var(--line), -3px 3px 0 var(--line); }
.logo h1 b { font-weight: 400; color: #ffd27a; }
.title-card { width: 100%; max-width: 420px; }
.credit { color: #fff; font-size: 12px; opacity: .85; text-align: center; margin: 6px 0 0; text-shadow: 0 1px 2px #000; }
#fade { position: absolute; inset: 0; background: #1a1424; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 30; } #fade.on { opacity: 1; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 45; } #flash.go { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<div id="game">

<script>
'use strict';
/* =========================================================
 *  도트 보장원 — 모든 그림은 코드로 한 픽셀씩 그립니다 (외부 이미지 없음)
 * ========================================================= */
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function shade(hex, f) {
  const [r, g, b] = hexRgb(hex);
  const m = (v) => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f)));
  return '#' + ((1 << 24) | (m(r) << 16) | (m(g) << 8) | m(b)).toString(16).slice(1);
}
function mix(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return '#' + ((1 << 24) | (Math.round(lerp(A[0], B[0], t)) << 16) | (Math.round(lerp(A[1], B[1], t)) << 8) | Math.round(lerp(A[2], B[2], t))).toString(16).slice(1); }
const OUT = '#2b2026';
function autoOutline(c, col = OUT) {
  const g = c.getContext('2d'), W = c.width, H = c.height;
  const d = g.getImageData(0, 0, W, H), a = d.data;
  const src = new Uint8Array(W * H);
  for (let i = 0; i < W * H; i++) src[i] = a[i * 4 + 3] > 40 ? 1 : 0;
  const [r, gg, b] = hexRgb(col);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x; if (src[i]) continue;
    if ((x > 0 && src[i - 1]) || (x < W - 1 && src[i + 1]) || (y > 0 && src[i - W]) || (y < H - 1 && src[i + W])) {
      a[i * 4] = r; a[i * 4 + 1] = gg; a[i * 4 + 2] = b; a[i * 4 + 3] = 255;
    }
  }
  g.putImageData(d, 0, 0);
  return c;
}
function fillPoly(g, pts, col) {
  g.fillStyle = col;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
    const sy = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) xs.push(a[0] + (sy - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
    }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const x0 = Math.round(xs[k]), x1 = Math.round(xs[k + 1]);
      if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1);
    }
  }
}
function fillEllipse(g, cx, cy, rx, ry, col) {
  g.fillStyle = col;
  for (let y = -ry; y < ry; y++) {
    const t = (y + 0.5) / ry, w = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t)));
    if (w > 0) g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}
function pline(g, x0, y0, x1, y1, col) { // 픽셀 선
  g.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) g.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
}
function flipX(c) { const o = mkCanvas(c.width, c.height), g = o.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return o; }
const iso = (x, y) => [(x - y) * 16, (x + y) * 8];

/* ---------------------------------------------------------
 *  캐릭터 5종 (성별 구분 없음) — 24×34 SD 도트

/* ---------------------------------------------------------
 *  쿼터뷰 상자 — 모든 가구·건물의 바탕
 *  S(u, v, z): u = x 방향, v = y 방향(타일), z = 높이(px)

    const tcol = col, l = lc || shade(col, 0.82), r = rc || shade(col, 0.68);

    fillPoly(g, [S(u1, v0, z0), S(u1, v1, z0), S(u1, v1, z1), S(u1, v0, z1)], r);

function setFloor(m, x0, y0, x1, y1, t) { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && y >= 0 && x < m.W && y < m.H) m.floor[y * m.W + x] = t; }

    joy.x = dx / RR; joy.y = -dy / RR; joy.active = Math.hypot(joy.x, joy.y) > 0.12;
  };
  pad.addEventListener('pointerdown', (e) => { id = e.pointerId; pad.setPointerCapture(id); const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; move(e); });
  const end = (e) => { if (e.pointerId !== id) return; id = null; joy.active = false; joy.x = joy.y = 0; knob.style.transform = ''; };
  pad.addEventListener('pointermove', move); pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
}
addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement || e.target instanceof HTMLTextAreaElement) return;
  if (!G.playing || G.modal) { if (e.key === 'Escape') closeAllPops(); return; }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyE' || e.code === 'Space' || e.code === 'Enter') { if (!e.repeat) doAction(); return; }
  if (/^Digit[1-9]$/.test(e.code)) { const b = document.querySelectorAll('#phrases button')[Number(e.code.slice(5)) - 1]; if (b) b.click(); else { const list = PHRASES[phraseKey()] || []; const t = list[Number(e.code.slice(5)) - 1]; if (t) mySay(t); } return; }
  keys.add(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

/* =========================================================
 *  화면 (팝업 · 버튼)
 * ========================================================= */
function openPop(sel) { $(sel).classList.remove('hidden'); G.modal = true; keys.clear(); $('#actBtn').hidden = true; }
function closePop(sel) { $(sel).classList.add('hidden'); G.modal = [...document.querySelectorAll('.screen-pop')].some((p) => !p.classList.contains('hidden')); refreshContext(false); }
function closeAllPops() { document.querySelectorAll('.screen-pop').forEach((p) => p.classList.add('hidden')); G.modal = false; $('#ventText').value = ''; refreshContext(false); }
document.querySelectorAll('.screen-pop').forEach((p) => {
  p.addEventListener('click', (e) => { if (e.target === p) { if (p.id === 'ventPop') closeVent(); else closePop('#' + p.id); } });
  p.querySelectorAll('.closer').forEach((b) => b.addEventListener('click', () => closePop('#' + p.id)));
});
$('#talk').addEventListener('click', () => { const ph = $('#phrases'), open = ph.hidden; ph.hidden = !open; $('#talk').setAttribute('aria-expanded', open ? 'true' : 'false'); });
$('#actBtn').addEventListener('click', () => doAction());
$('#music').addEventListener('click', () => { audioInit(); setMusicOn(!AU.on); });
// 불만창고: 적은 내용은 어디에도 저장·전송되지 않고 바로 지워져요
let ventKind = 'burn';
function openVent(kind) {
  ventKind = kind;
  $('#ventTitle').textContent = kind === 'burn' ? '스트레스 적기' : '임금님 귀는 당나귀 귀';
  $('#ventGo').textContent = kind === 'burn' ? '🔥 벽난로에 던지기' : '🗯️ 마구 외치기';
  $('#ventText').placeholder = kind === 'burn' ? '오늘 나를 힘들게 한 일을 적어 보세요' : '하고 싶은 말을 마구 쏟아내세요';
  $('#ventText').value = '';
  openPop('#ventPop');
  setTimeout(() => $('#ventText').focus(), 30);
}
function closeVent() { $('#ventText').value = ''; $('#ventText').blur(); closePop('#ventPop'); }
function submitVent() {
  const len = $('#ventText').value.trim().length;
  if (!len) { const sh = $('#ventPop .pop'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake'); return; }
  closeVent(); // 내용 즉시 삭제
  if (ventKind === 'burn') { throwPaper(G.me); G.fx = { k: 'burn', n: (G.fx?.n || 0) + 1 }; setTimeout(() => mySay('활활 타라~ 🔥'), 900); }
  else { const d = clamp(len * 0.12, 2.5, 12); startRant(G.me, d); G.fx = { k: 'rant', n: (G.fx?.n || 0) + 1, d: Math.round(d * 10) / 10 }; }
  sendPresence(true);
}
$('#ventGo').addEventListener('click', submitVent);
$('#ventCancel').addEventListener('click', closeVent);
$('#ventText').addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVent(); if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) submitVent(); });
$('#act2').addEventListener('click', () => {
  const k = $('#act2').dataset.k;
  if (k === 'sip') { startAct(G.me, 'sip', 1.2); sfx('sip', G.me); G.fx = { k: 'sip', n: (G.fx?.n || 0) + 1 }; sendPresence(true); if (Math.random() < 0.5) setTimeout(() => mySay(pick(['캬~ 좋다', '후루룩 ☕', '살 것 같다'])), 700); }
  else if (k) openVent(k);
});
// 캐릭터 고르기
function thumb(i, scale = 3) { const c = mkCanvas(24 * scale, 34 * scale), g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(chibi(i, false, 0, 'stand', { happy: true }), 0, 0, 24 * scale, 34 * scale); return c; }
function renderDesigns(el, cur, onPick) {
  el.replaceChildren();
  DESIGNS.forEach((D, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'design' + (i === cur ? ' on' : ''); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', i === cur ? 'true' : 'false');
    b.append(thumb(i)); const s = document.createElement('span'); s.textContent = D.name; b.append(s);
    b.addEventListener('click', () => onPick(i)); el.append(b);
  });
}
let pickDi = clamp(parseInt(store.get('bjw.design') ?? '', 10) || 0, 0, DESIGNS.length - 1);
$('#nick').value = store.get('bjw.nick') || '';
function pickTitle(i) { pickDi = i; renderDesigns($('#designs'), pickDi, pickTitle); }
renderDesigns($('#designs'), pickDi, pickTitle);
$('#charBtn').addEventListener('click', () => { renderDesigns($('#charPick'), G.me.di, changeChar); openPop('#charPop'); });
function changeChar(i) {
  G.me.di = i; store.set('bjw.design', String(i)); renderDesigns($('#charPick'), i, changeChar);
  closePop('#charPop'); mySay(pick(['짜잔! ✨', '변신 완료!', '어때요? 😎'])); sendPresence(true);
}
$('#tpBtn').addEventListener('click', () => {
  const el = $('#tpList'); el.replaceChildren();
  for (const [k, s] of Object.entries(SPOTS)) { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s.label; b.addEventListener('click', () => teleport(k)); el.append(b); }
  openPop('#tpPop');
});
$('#brand').addEventListener('click', () => {
  const el = $('#people'); el.replaceChildren();
  const all = [...G.actors.values()].sort((a, b) => (b.me ? 1 : 0) - (a.me ? 1 : 0));
  for (const A of all) {
    const row = document.createElement('div'); row.className = 'person'; row.append(thumb(A.di, 1));
    const n = document.createElement('span'); n.textContent = A.name + (A.me ? ' (나)' : ''); row.append(n);
    const z = document.createElement('small'); z.textContent = ZONE_LABEL[zoneOf(A.map, A.x, A.y)]; row.append(z); el.append(row);
  }
  $('#netSum').textContent = room ? `지금 ${all.length}명이 함께 있어요. 다른 사람을 누르면 콕 찌를 수 있어요.` : '멀티플레이에 연결되어 있지 않아요 (혼자 모드). claude.ai에서 열면 같이 접속한 사람이 보여요.';
  openPop('#netPop');
});
// 사진
let shotBlob = null;
$('#shotBtn').addEventListener('click', () => {
  render(0);
  const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  sfx('pop', null, 2);
  R.view.toBlob((b) => {
    if (!b) return; shotBlob = b;
    const old = $('#shotImg').src; if (old.startsWith('blob:')) URL.revokeObjectURL(old);
    $('#shotImg').src = URL.createObjectURL(b); $('#shotInfo').textContent = `${ZONE_LABEL[G.zone] || ''} · ${$('#clock').textContent}`;
    openPop('#shotPop');
  }, 'image/png');
});
$('#shotSave').addEventListener('click', async () => {
  if (!shotBlob) return;
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  const name = `보장원-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.png`;
  try {
    const dl = window.claude?.use ? await window.claude.use('downloads') : null;
    if (!dl) { $('#shotInfo').textContent = '여기서는 바로 저장할 수 없어요. 사진을 길게 누르거나 오른쪽 클릭해서 저장해 주세요.'; return; }
    await dl.save({ filename: name, data: shotBlob });
    $('#shotInfo').textContent = '💾 저장했어요!';
  } catch (e) { $('#shotInfo').textContent = e && e.code === 'declined' ? '저장을 취소했어요.' : '저장하지 못했어요. 사진을 길게 눌러 저장해 주세요.'; }
});

/* ---------------- 타이틀 그림 ---------------- */
function drawLogo() {
  const c = $('#logoArt'), g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const t = towerSprite({ w: 4, d: 2, h: 56 }, false);
  g.drawImage(t.c, 60 - t.ax - 16, 74 - t.ay - 8);
  for (const [i, x] of [[0, 18], [4, 34], [1, 80], [3, 96]]) g.drawImage(chibi(i, false, 0, 'stand', { happy: true }), x, 48);
  g.fillStyle = '#f2c230'; fillEllipse(g, 12, 16, 6, 6, '#ffd23a');
}

/* =========================================================
 *  시작
 * ========================================================= */
function enterGame() {
  const nick = ($('#nick').value.trim() || '사원' + Math.floor(rand(100, 999))).slice(0, 10);
  store.set('bjw.nick', nick); store.set('bjw.design', String(pickDi));
  audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  const A = newActor('me', pickDi, nick, true);
  A.map = 'out'; A.x = 20.6; A.y = 10.6; A.dir = 3;
  G.me = A; G.actors.set('me', A); G.map = MAPS.out; G.camSnap = true; G.playing = true;
  $('#title').classList.add('hidden');
  for (const s of ['#hud', '#joy', '#side']) $(s).classList.remove('hidden');
  const hint = $('#hint'); hint.textContent = matchMedia('(pointer: coarse)').matches ? '핸들로 걷고, 바닥이나 의자를 톡 누르면 그 자리로 가요' : '방향키·WASD로 걷고, 바닥을 클릭하면 그 자리로 가요 · E 행동';
  hint.classList.remove('hidden'); setTimeout(() => hint.classList.add('hidden'), 7000);
  // 횡단보도 앞에서 시작해 자동문을 지나 로비로
  walkTo(20.9, 6.45, null, true);
  updateOnline(); refreshContext(true);
  connectRoom();
}
$('#enter').addEventListener('click', enterGame);
$('#nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') enterGame(); });

let last = performance.now(), slowT = 0, ctxT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; G.t += dt;
  slowT -= dt;
  if (slowT <= 0) {
    slowT = 1; G.tod = timeOfDay();
    const h = G.tod.h, hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
    $('#clock').textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; $('#tod').textContent = G.tod.label; $('#clockIc').textContent = G.tod.icon;
  }
  updateCats(dt); updateCars(dt);
  if (G.playing) {
    updatePlayer(dt);
    for (const A of G.actors.values()) updateActor(A, dt);
    updateParts(dt);
    flushPresence(dt);
    ctxT -= dt; if (ctxT <= 0) { ctxT = 0.2; refreshContext(false); }
    const z = G.zone, mk = G.me.map === 'out' ? (z === 'food' ? 'food' : G.tod && G.tod.dark > 0.5 ? 'night' : 'day') : ({ work: 'work', meeting: 'work', pantry: 'work' }[z] || z);
    musicSet(mk);
  } else updateParts(dt);
  try { render(dt); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
function boot() {
  buildOutdoor(); buildInterior(); buildCats(); buildCars();
  G.map = MAPS.out; G.tod = timeOfDay();
  resize(); drawLogo();
  requestAnimationFrame(frame);
  window.__bjw = G;
}
boot();
